[package]
name = "kestrel-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Fast, lightweight Minecraft: Java Edition launcher for Linux"

[lib]
name = "kestrel_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kestrel"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kestrel-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
# Embed the built frontend so the binary runs without a dev server.
# The Tauri CLI enables this for `tauri build`; plain `cargo build --release`
# needs it passed explicitly.
custom-protocol = ["tauri/custom-protocol"]
